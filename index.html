<style>

  .tip.collapsed { margin-bottom: 10px; }

  }

  footer {

<script>
const STAGES = [{"name":"SQO","tips":[["2121302560267178120","the biggest, most important qualification criteria is\n\ntheir comfort level/maturity on the opportunity \n\nthe best proxy \n\n(1) quality of questions they ask\n(2) how they've tried solving before","2026-11-13"],["2115563584428351883","the more excitement they show on a first call\n\nthe more it's a red flag   \n\nreal, real opportunities play it very cool","2026-10-28"],["2103097657803555022","only three things matter in enterprise sales …\n\n1. is there internal pressure/incentive\n2. do you have their cell number \n3. have they shared insider intel/gossip","2026-09-24"],["2069462755703136579","in sales, i don't know who needs to hear this, but you never ask the prospect ...\n\n- do you have budget?\n- are you the decision maker? \n\nit's your job to pick-up on that","2026-06-23"],["2064858801778360788","in enterprise sales, a deal is only qualified if you are texting and able to call without calendar event …","2026-06-10"],["2058507530788057351","here’s where you will waste a ton of time re: enterprise sales …\n\n- ‘let’s take a step back’\n- ‘material to socialize’\n- asking for a case study\n- brings 3+ folks to any call\n- communicates beyond 1 level \n- ‘i’ve said this for years …’\n- next step is 2+ weeks out \n- won’t give you their cell \n- not comfortable sharing inside gossip","2026-05-24"],["2041490600311099434","enterprise startups: ~75% of calls with an account are about collecting ground-intel NOT selling\n\nonly sell when you have all the context, otherwise it will fall flat 100% of the time ...","2026-04-07"],["2004900109868204068","if you’re not speaking to N or N-1, it’s not qualified, influence is everything","2025-12-27"],["1983882119785939432","quality of your questions is critical for discovery; the quality of their questions is critical for intent","2025-10-30"],["1983882119785939432","land in a business unit first, crossing business unit lines for a sale increases deal kill rate AND sales cycle exponentially","2025-10-30"],["1971926448199160027","enterprise startups:\n\nthe less mature their buying process the more likely land/lead with selling services … \n\nthe more mature their buying process, the more you can land/lead with selling the tech …","2025-09-27"],["1963941755113349135","If the problem is not currently being measured OR managed, it’s likely not chaotic enough to be a priority, today.","2025-09-05"],["1924126759663845398","startups - enterprise inbound leads are great (obvious) BUT the not so obvious implication is that they are often educated by someone else — likely an incumbent/competitor \n\nthey inbound as they are in ‘buying phase’ BUT someone has pre-shaped their point of view/expectations  …  \n\nthe biggest leading indicator of someone that’s likely been educated by a competitor, is an inbound that is mid-level … not always, of course, but more often than you think\n\nit’s the tale sign that the search has been delegated\n\nleads sourced by outbound are truly such an opportunity — slightly longer sales cycle but way more control of the frame","2025-05-18"],["1923712621447930149","in sales, you get way more intel calling a cell than zoom ... \n\n- informal\n- more vulnerable \n- you now have ability to to text them\n\nif you can, ask to call them directly, it feels different","2025-05-17"],["1882095689590853693","so many are trying to accomplish way too much on first sales call\n\nslow down, get the intel and leave some intrigue for follow-up calls\n\nintrigue is critical — otherwise they are controlling the entire process","2025-01-22"],["1873386112078799330","asking for sales material is seldom a request of a qualified lead","2024-12-29"],["1851793880401813964","in enterprise sales, the EA can be such a good source of exec. intel -- esp. for more traditional corps.\n\n1. OOO/vacations (buffer into plan) \n2. if they plan to be in X city (maybe you're there too)\n3. have they had a meeting with X yet (project managing deals)\n\nyou'll need to get them on the phone to get the intel, but boy do they talk ;)","2024-10-31"],["1836051564324106459","if you are selling an AI-based solution and the buyer maturity is somewhat advanced-ish—i.e., meaning they're ready to acquire a technology and have a strategy/process defined—find out who educated them.\n\nfrom my experience, advanced buyer maturity usually means they have someone educating, counseling, and possibly selected in their mind —dig into that, address the elephant in the room.\n\nleading indicators of this: mid-level exec inbounding, an RFI/RFP, procurement is involved early, etc.\n\nsaid differently, if you're not the one educating, someone else is ...","2024-09-17"],["1832897933223821523","do not sell through users to get to buyers  \n\nmost users will be gatekeepers/blockers to buyers, albeit unintentionally -- seems counterintuitive but, seen it enough times \n\nhere's why ...  \n\n1. users are 3+ levels removed from the buyer, meaning they do not have direct access.\n 2. related to above, when a user tries to sell on a startup's behalf, it becomes a game of telephone sidelining the deal\n3. value proposition that appeals to the user is often too technical, or it lacks alignment with the problems executives (buyers) are prioritizing \n4. less common (but common enough to mention) user doesn't want buyer to know they are even a user, so say they'll help to be kind, but don't\n\ninstead ...  \n1. go direct 1:1 to buyers understand how to align the pitch/positioning to their priorities  \n2. ask top users to make email intro to buyers and include them in the discussion (don't go through them) -- give them copy, and you own sales process","2024-09-08"],["1829182803243872445","the more eager someone is to see a demo without providing quality questions/answers, the more likely it's a phishing expedition OR check-box \n\neagerness/impatient is often a negative signal -- the calm folks are likely the real, real buyers","2024-08-29"],["1811201687459348710","a startup seldom has a ‘closing problem’, \nit’s often a qualification problem\n\nsaid differently, they spent time and energy on the wrong prospects","2024-07-11"],["1807091844221645153","a few negative signals on first sales calls:\n- in a rush\n- overly enthusiastic \n- immediately suggests they are a buyer\n- next step: sales collateral \n\nfrom my experience, the best signals:\n- a bit of skepticism\n- calm and use a lot of ‘we’ \n- descriptive with their answers \n- next step: scheduled call AND/OR responses to specific open questions","2024-06-29"],["1782012935050588231","if you’re holding sales conversations that sound like …\n\n- ‘what keeps you up at night?’\n- ‘what are your priorities today …?’\n- ‘if you had a magic wand …’\n\nyou’re spinning your wheels into an oblivion\n\nin startup sales you are testing/leading with a specific problem and vision (assumptions) — you’re helping them understand/unlock an ah-ha, not the other way around","2024-04-21"],["1781274255801335883","Never expect the user to sell to buyer on your behalf — go direct to buyer with insights you learned from users — in many cases users can be a blocker.","2024-04-19"],["1779470399396286588","sell to a single decision-maker: if you can, without the need for them to get buy-in from other business unit peers -- meaning the value is contained within their team for 'land' and can be signed off with their budget VS trying to go wide into other teams, which increases sales cycle AND odds of getting sidelined.","2024-04-14"],["1773666730042089856","Most early-stage startups don't have a bottom-of-funnel sales problem but a top-of-funnel sales problem.\n\nIt almost always points back to Qualification. \n\nThis issue manifests in two ways:\n\n1. Being too liberal and rushing to show pipeline growth -- this manifests by adding anyone into the funnel who is willing to take a meeting and advancing anyone willing to take follow-on calls simply because they're willing to give you more time (aka meeting exhaustion).\n\n2. Having such a wide value proposition that more decision-makers are introduced leads to a stalemate or becoming indefensible as you go deeper into the organization.\n\nI totally get it; building a pipeline is one of the few ways to demonstrate early learning, forward momentum, and team excitement -- however,  if it's fruitless, the math and unrealized revenue will soon reveal the truth.   \n\nDisqualifying early may feel counterintuitive when you are eager to show market advancements, but it will save you from false hope and a significant amount of time and energy wasted.","2024-03-29"],["1767560861248364571","larger companies create (by design) \ninternal buying friction to filter out anything \nthat doesn't have strong motivation behind it\n\nyou must unlock and align \nwith an exec(s) top priority otherwise, it's not worth \ntheir time and energy","2024-03-12"],["1757151834333147500","b2b/enterprise startups: beware of this trap when speaking to both users and buyers ...\n\nthere is a spectrum of how problems are preceived within an organization -- some are objective and subjective\n\non one end you have ...\n\nevidence-based problems, growing/widening at noticable clip and direct implication if not solved (objective)\n\n... and on the other end, \n\ncomplaints/frustration that are far more static, limited/no implications and risks if not solved today (subjective)\n\nbe very careful when speaking/learning from users and buyers -- i've seen startups position themslves against a 'users' challenges only to have the buyer suggest -- 'we hired that person to do that job, that's their job to work through X'","2024-02-12"],["2122067066975043701","it’s having a casual, unscripted conversation with focused guardrails to identify areas of motivation, momentum, excitement l\n\nit’s also admitting timing or their team maturity is slightly off …","2026-11-15"],["2067768455302914213","people over think their wording and messages\n\nit often just reads weird corpo and, thus, bloated\n\nfree write, cut as many words as possible, and hit send","2026-06-19"],["2047041944023433557","ask uncomfortable questions >> unique insider intel","2026-04-22"],["2045508636789661836","startups — enterprise deals never, ever have call recorders present \n\nalmost exclusively off the record …","2026-04-18"],["2021961096081363324","enterprise sales is all about inside baseball   \n\nit seldom happens without someone giving you off-the-record intelligence others don’t have ...\n\nfor example, this is why if you're not on text, that relationship isn't there","2026-02-12"],["2015861410459263158","enterprise executives get 1-at-bat every few years (~3yrs) to bring in a net-new tool\n\nthink about that for a minute \n\nyes, it’s hard\n\nBUT, if you deliver on value and continue to do so, it’s so, so hard to displace you … \n\nthis is why it’s a race to get in now and run through walls for them","2026-01-26"],["1992243511110865006","in sales, you work for the customer\n\nso many folks forget this … \n\nand, that doesn’t mean sales dictates the product roadmap — that’s the Founder’s job\n\nit means you understand your customer’s problem 5% better than they understand themselves, you serve them better than their internal peers can, and you communicate and defend their WHY internally","2025-11-22"],["1984356773491306670","there is nothing more disingenuous and low trust than \n\n‘Re:’\n\non your first email to someone","2025-10-31"],["1983882119785939432","find a back/side-door in — make it feel different","2025-10-30"],["1971238328998703210","from all of my startup sales experience, seldom do warm intros from non-customers every close ...\n\non the contrary\n\nintros from customers is the highest signal\n\ndon't confuse these two","2025-09-25"],["1964673375814742425","startups: i can't stress enough, if your enterprise customers aren't texting with you during buying process, it's a major red flag ...","2025-09-07"],["1916483231643312262","normalize 15min calls — default should not be 30min\n\nyes, this is for enterprise sales too","2025-04-27"],["1915369930351948187","every single sales call is different \n\nsingle goal - learn something you didn’t know, teach them something they didn’t know","2025-04-24"],["1892646253634220179","in today's market, the shorter the sales meeting, the better\n\n1. keep content for next call\n2. perception you make it easy and focused\n3. people are just happier and friendlier when conscious of their time","2025-02-20"],["1890739234039795855","Do not over share, it kills their imagination and excitement — esp true in outbound notes.","2025-02-15"],["1890739234039795855","Someone asking for more features is (almost) never an early adopter. Easy and lightweight is how to test unproven partners ;)","2025-02-15"],["1887552169496232316","startups: cold outbound really, really works if you can incorporate relevant, industry-specific nuance paired with right problem \n\npersonalization for personalization seldom works","2025-02-06"],["1867693617873399862","your convo should be so focused that you are able to always end call early\n\ntight call mgmt builds so much trust ...","2024-12-13"],["1863196431734952081","there is always someone in the enterprise looking to kill your deal\n\nthis is why staying contained to a business unit at first is, so, so critical -- so you can build the case to expand and defend it with others \n\nthe wider you go on day 1, the more likely you step on toes","2024-12-01"],["1855971311006216687","enterprises don’t care to solve problems that aren’t growing/widening …","2024-11-11"],["1853544600297992565","a signal of natural pull in the enterprise\n\nexecs want to 'co-author' the vision/future state alongside you","2024-11-04"],["1849068303571935485","in sales-led motions, you should spend more hours prepping for sales calls than actually in sales calls\n\nwinning the right deals is all the matters in the early, early days (it's your future referencability)\n\na layer further, more prep suggests your sales calls are highly relevant, highly qualified, hand-selected VS sell to anyone with a pulse ...","2024-10-23"],["1840805013330796868","any enterprise suggesting they want to see you deliver more value/use cases to buy is likely NOT an early adopter.","2024-09-30"],["1816142492472844488","Outbound leads should have a higher contract value than inbound. \nHint: You get to target and pick, and execs seldom inbound - they delegate and have someone else do their research. If you're not educating, you're easily commoditized.","2024-07-24"],["1780198108283941142","the wider the surface area you touch, the more decision-makers are involved; more decision-makers mean they have their own unique view on how to solve and a solution they might prefer - a decision could lead to a stalemate","2024-04-16"],["1773327467001815041","your customers want to understand if you understand them\n\nwhere you dig, what you question, how you position yourself in accordance to their risk exposure -- it's all being evaluated and assessed, esp. up-market","2024-03-28"],["1768962928349171865","b2b startups: true early adopters\ndo not want a complete solution\n\nread that one more time\n\nthey want a quick, easy way to capture \na unique, competitive edge \nbefore anyone else in the market \ncan extract the value\n\nlaggards want complete solutions\n\ntherefore, overbuilding will repel you \nfrom true early adopters AND \nanyone asking/requiring more features \nis likely wasting your time (i.e., tire kicking)","2024-03-16"],["1765753704550908395","leads are most vulnerable in early calls (1 or 2) and become less so over time and more tight-lipped \n\nwhy?\n\nfeels more like sales process and become more guarded","2024-03-07"],["1764991101251747929","Never, ever test solution-based assumptions \n>> Reminder -The solution is abstract to most. Automation is a solution, not a problem. Insights are a solution, not a problem. More revenue is a solution, not a problem.","2024-03-05"],["1758125966482919478","negative feedback is part of the process, if it's not happening you're not forcing the hard conversations re: will you pay, now?","2024-02-15"],["1744008743560339462","Ask the hard hitting questions if evidence isn’t there. Best to qualify than on-going meeting exhaustion and theater.","2024-01-07"],["2108587291954274615","enterprise maturity arc with AI = Dunning–Kruger\n\nStage 1: building with agent’s internally\nStage 2: a lot f*kin’ harder than we thought \nStage 3: take our $$, here’s what we want; let’s go","2026-10-09"],["1939852489307852846","sales tip\n\nwrite your note in iMessage before you write it in email \n\nwill change the whole vibe, for the better","2025-07-01"],["1882427374211567631","chill out on your sales calls\n\nbe excited and bring energy, but don’t be so obvious with sales questions and tactics\n\nit should feel like a natural discussion","2025-01-23"],["1876429162589872637","so many sales challenges are a result of market perception and you not owning the framing … \n\nsometimes entering via non-obvious role, you can own that voice far better … \n\nsales is often a search of a side door/cracked window …  seldom front door","2025-01-07"],["1838609363788788063","for early-stage startups, warm intros tend to lead to more false positives/false momentum than not","2024-09-24"],["1805631427490254972","when someone is earlier in their buyer maturity, they are likely often buying access to YOU … those later in buyer maturity are buying access to YOU + PRODUCT","2024-06-25"]]},{"name":"Initial Demo","tips":[["2115852669348704565","demo should never be focused on the product — focus is on how it increases/grows their influence in the organization","2026-10-29"],["2115083137784930635","in sales, i refuse to send one-pagers, presentation slides, loom videos, or other scaled collateral  \n\nthree bullets crafted for them OR we’re in product together showing off the magic to whom needs to see it with a highly contextualized storyline   \n\nanything else, is too far removed from their world-view","2026-10-27"],["2096569097836261653","corporates entire job is to build for the boss; the frame needs to land for their boss/board (i.e. C-suite)","2026-09-06"],["2078508731235455395","'I will bring my boss, who's joining on your side' = I expect you to match seniority -- ie. your founder\n\n'No questions from my side\" = I have no idea what just happened","2026-07-18"],["2072987386913362087","in enterprise sales, it is very, very hard to differentiate at the problem-layer\n\ncritical to know (of course), but it’s seldom the pitch focus\n\nit’s the alpha you are selling … \n\nin short, how does their influence widen/grow because of you \n\nwhat are you handing to them that changes their mind on economics of their P&L\n\nthat’s the reward for risk of changing …\n\nchanging for ‘better’ isn’t worth it","2026-07-03"],["2070834332004913309","group/team demos are almost always a net negative\n\nunless, you've one-off'd with 80% of attendees prior AND have all their individual context and thoughts","2026-06-27"],["2051683695585562790","the biggest mistake in sales\ndemoing the entire product …\n\n80% of value comes from 20% of the build, almost always","2026-05-05"],["2037913759423823993","enteprise sales is about understanding the existing corporate narrative that’s being circulated \n\nthis is often “insider intel” that everyone skips over\n\nit’s about helping them neatly fit you (frame) into the existing storyline \n\nit’s never, ever actually about the product itself","2026-03-28"],["2031773098274394420","almost every single enterprise deal i've closed required the other side to co-design the sellable \n\n- Why change ...\n- Why now ... \n- Why us ... \n\notherwise it's missing all the context, nuance, and relevance to make it feel high-fit","2026-03-11"],["2015117724914204903","selling a problem is too small thinking \n\nproblems are often obvious, there’s no ah-ha in that \n\nmost market speaking to same “pain” - so fast way to be commoditized\n\nand then paired with an unauditable big number that feels sales-y\n\nthe magic is in naming the problem BUT selling executive alpha — something they can share with their c-suite and they say “look at this, how they flipped Y, and what it will do outperform X (ie measured metric) …”","2026-01-24"],["1989315827208724839","when you pitch, the storyline is 1 + 1 = 10, the value needs to feel like a 'no-brainer' AND really, really different","2025-11-14"],["1986414396260729105","there's a hierarchy in selling ... \n\n1. sell the alpha\n2. sell the vision\n3. sell the problem (base requirement)\n\nsell alpha is what they get celebrated for \n\nit's a complete step-change of edge from where they are today ... \n\n- unlock value beyond customer's team \n- access to first-party information/data \n- nearly whip-out a possible liability \n- ability to cut an external reliance","2025-11-06"],["1986220917773709814","sales folks\n\nre: product demo here's very under-discussed implication... \n\nshow ONLY the 20% that drives 80% of the value\n\nif you show too much, there is a high risk they consider a lot of it unusable AND thus, can't make sense of price/value","2025-11-05"],["1905259839321755922","enterprise startups — sales decks are waste of everyone’s time \n\nplain text email memo + no-brainer, highly project managed paid pilot","2025-03-27"],["1897381195429949468","startups -- in the enterprise, the more technical your pitch, the faster you’re delegated down the chain of command  \n\nensure your value prop aligns with where you're entering the org -- and it should be different whether flex up or down","2025-03-05"],["1895102610123731423","startup - enterprise sales pitch deck should be 5 slides max\n\nif it’s more, likely oversharing, not making it specific enough, and seemingly making it feel more complicated … \n\nin todays market, complexity is a huge killer — too much lift/effort on their end dead on vine","2025-02-27"],["1877868968448262294","business model insights excite executives \n\ntechnical/engineering insights excite users \n\nsell the latter in your sales pitch to execs and you’ll be quickly delegated down chain of command","2025-01-11"],["1877424761891876949","if you really want to captivate prospects, your intro on your startup before you OR anything else should be ...\n\n\"let me share where this started, here's the business model/technical insight ... \"\n\npeople love different views/ways of thinking","2025-01-09"],["1859216371323723965","the more you move up-market, the more the sell becomes a game of telephone\n\nthe only way your idea gets shared is if it's fun to share & easy to grasp\n\nfun to share/easy to grasp can come in form(s) of:\n- contained: highly specific to their role/use case \n- counter-intuitive insight\n- analogous (Uber of x)\n\nsupporting the internal sell is often under-discussed - and it's seldom them opening up a pitch-deck","2024-11-20"],["1845833574202708137","ensure you position yourself in a way where it's not perceived as a switch\n\nit's very, very rare for an early-stage startup to win when there are switching costs involved ... \n\nyou need to dispel any comparison to existing tools -- this is done via visionary-led sales and challenging their existing beliefs today on a very specific, contained assumption (i.e. turn their head)\n\nearly-adopters will take calculated, confined risk if your vision has substantial payoff for them","2024-10-14"],["1829872059163250759","the more technical your pitch, the more you'll be delegated down the chain of command\n\nif you're selling something more technical it's best to enter upper mid-level exec. and leverage those conversations to get insights for how to best refine value for c-suite ...","2024-08-31"],["1825997817690591513","if you can, have your prospect demo for you how they do X, BEFORE you demo for them","2024-08-20"],["1816142492472844488","In order to break into the enterprise, you can't be a comparable. \nHint: Procurement teams will suggest that the Business Unit align with existing preferred vendors, first.","2024-07-24"],["1795983586962682176","ask the customer to demo for you how they do X before you demo for them \n\nit will give you so much of an edge when you demo ...","2024-05-30"],["1788286802605858967","when a startup pre-maturely races to a demo (upmarket) it suggests \n\n1) you don’t know what questions to ask \n\n2) you’re hoping the market gets themselves to an ah-ha by seeing technology/tool \n\nA demo is the last thing you want to race to …\n\n1) only leverage/carrot in sales process - use it only once you have all intel and gather right folks around table\n\n2) as soon as they see it, it starts to feel like sales relationship and and they become less vulnerable re: sharing about their situation","2024-05-08"],["1784548291448811686","most startups blow the demo as they think it’s a ‘scalable’, scripted demonstration of the product\n\na demo should never be scalable and/or focused on the product — if it is, send a video - you don’t need a sales rep wasting their time \n\na great ‘demo’ is … \n\n>>> sharing your understanding/interpretation of what you learned about them — demonstration of listening and alignment\n\n>>> storyline with where they are today and where they’ll see initial time to value — demonstration of near-term-expected value about their situation; everything else is abstract\n\n>>>prospect guiding you/asking questions — demonstrating their intent and maturity (re: possible education on other solutions) \n\n… you’ll collect more intel & quickly decommoditize yourself from any other alternative — this is leverage to win deals and make them feel like it was built specifically for them …","2024-04-28"],["1778416059797692636","startups -- sales likely feels uncomfortable because you're advancing them too quickly -- rushing leads to friction\n\nfriction makes everything feel off and weird\n\ndemoing too quickly creates friction whether you do it OR they ask for it ... read that one more time\n\nif there is alignment on a problem, understanding, and you have a way to show them where they are today (enough insight) AND where you can take them tomorrow (vision aligned to their reality) -- it's a f*cking beautiful thing","2024-04-11"],["1775905695772168634","when a customer's response to your startup demo is: \n'oh, cool,' this is likely a negative signal\n\nquality of their questions is an indicator of intent","2024-04-04"],["1773327467001815041","if you go in trying to rip a d replace the incumbent, they'll balk\n- if you stay too high-level on the problem, they'll balk\n- if you go in speaking to vision (big promises) VS to reality, they’ll balk \n- if you try to skip steps in their buying process, they'll balk\n- if you sound too good to be true (‘we’re better than known incumbent’), they’ll balk\n\nit's such a balance, it's so, so hard -- and, they want to know you understand them and their problem better than they do, that's what they're buying access to","2024-03-28"],["1768229330289570271","enterprise startups - if you come in with the following, you'll raise a red flag to the prospect:\n\n- 'rip and replace' incumbent \n- yes-ing them re: all requests\n- suggesting you serve multiple use cases\n\nenterprises want to see you as a subject matter expert on something highly specific and contained (i.e. single point in the value chain)\n\nas soon as you suggest you handle multiple use cases, you'll immediately get (1) more decision makers involved (moe risk and more time) (2) compared to their preferred partner list, AND make your pitch lack any defensibility with procurement\n\ni've seen it over, and over, and over again.","2024-03-14"],["2092309498992140600","founder involvement in enterprise sales is the friggin' magic ... \n\nnuance: make sure it's paired in loop with their exec sponsor","2026-08-25"],["2078508731235455395","'send me what I can share internally' = 3 bullets\n\n'this is exciting' = let me play a role where I can show how I helped shape this for us internally","2026-07-18"],["2076399880583450832","enteprise sales has two jobs:\n\n- get them into \"imagine\" mode via highly unique exec. frame\n- project manage their buying process like a friggin’ psychopath","2026-07-12"],["2069943262727589968","it's so, so much easier for them to NOT do the deal \n\nit's never about better\n\nit's always about different \n\nshake their thinking, different","2026-06-25"],["2055725537658630306","no one clicks the link\n- no one looks at looms \n- no one hits “see more”\n- no one looks at case studies\n- no one looks at your attachments\n\nunless, it’s co-authored …","2026-05-16"],["2035130498301755638","in the enterprise, S-tier logos are so, so different \n\n- they want different \n- they want to co-create \n- they want an in with founder\n\nthey want to be apart of the vision","2026-03-20"],["1992031863301365823","nothing kills a call vibe more than long-winded openers, answers, and choppy storyline","2025-11-22"],["1989315827208724839","corporates build for the boss, startups/SMB build for the customer","2025-11-14"],["1970142137074225499","sales material should be sent near bottom-of-funnel, seldom at top-of-funnel","2025-09-22"],["1963941755113349135","Specificity is fastest way to build market trust — “Wow, I feel like you understand this better than I do.”","2025-09-05"],["1963941755113349135","If you don’t own the framing over and over again, their perception will kill your win rate.","2025-09-05"],["1963758214324887686","in sales, the ability to read the room in real-time is everything ... know when to\n\n- go deeper\n- move on \n- wrap-up\n- have a laugh\n- call yourself out","2025-09-05"],["1916086207794106852","early-stage enterprise sales is not anchoring to a pain — the market should be able to do that without you\n\nearly stage sales is getting them so excited about Founder’s unique vision/business model insight\n\nhow customer will look great internally because they are able to unlock Y \n\nit elicits the — “yo, check this out”, with peers \n\nit’s actually far more alpha/ego for them than anything else","2025-04-26"],["1911390561140986087","say something surprising, shocking, let them live through your energy -- they should leave the call saying \"whoa\"\n\nchanging/introducing something new is a big deal in a corporation -- make them feel like they're like this is a movement","2025-04-13"],["1858189077881000396","enterprise execs are eager to partner with startups because they too want to be apart of the next big thing ... \n\nbut, there's a balance you need to strike ... \n\nit needs to feel specific, unique, and contained-ish to them, BUT a big enough swing to knowingly elevate their influence internally \n\nthey will take a max of ~1 maybe 2 at-bats per year ...","2024-11-17"],["1840805013330796868","when you have limited time to prove the experiment, focus on refining your vision to a highly specific, differentiated value to get your foot in the door, and widen value over time re: expand","2024-09-30"],["1781274255801335883","Larger organizations buy access to subject matter experts — they want to know you, the Founder, know their problems > 5% better than they do …remember: software + services","2024-04-19"],["1777071642356633642","When Founders suggest that their product isn't ready to sell, they think sales is about selling a product.\n\nEarly-stage startup sales is about getting them excited about YOU (the Founder), how you see the world differently, and, most importantly, how you can uniquely solve their specific problem. \n\nDo not delay Founder-led sales because you're waiting for the product to be finished.\n\nBring mock-ups to the conversation, high energy to learn and go deep on their problems, and capture market insights on Day 1.\n\nYou're selling a reason/perspective as to why they need to solve the problem OR solve it differently -- this is the concrete (non-abstract) defense necessary to get many new purchases over the line today.","2024-04-07"],["1775238652949369088","startups: 'we're different' is far superior to 'we're better'","2024-04-02"],["1772600952295415817","tech itself rarely convinces someone — in most cases its abstract or feels similarish-to incumbents (esp. up-market) — pin-pointing part of value chain that’s broken/not good enough to open eyes first — so they can see why solving is critical and worth the risk","2024-03-26"],["1995121993591427526","the problem with most sales folks is you feed them more slides in the hope it aids in the deficit of their storytelling ability\n\nstorytelling is what is felt - it’s the energy, reading the room, confidence, is the ‘vision casting’ — it’s the art","2025-11-30"],["1960111949032595913","sales folks:\n\n- shorten your meetings\n- shorten your emails\n- shorten your pitch\n\neveryone is so long-winded","2025-08-25"],["1883193325060337970","startups: the exec. market absolutely loves hearing business model insights …\n\n- something different to share with peers\n- something to vicariously be apart of\n- something to ignite a fire from within \n\n… they buy more into it even before product","2025-01-25"],["1842653245405311064","bring mock-ups to the conversation, high energy to learn and go deep on their problems, and capture market insights on Day 1\n\nyou're providing a position as to why they need to make a change","2024-10-05"]]},{"name":"Technical Validation","tips":[["2096569097836261653","make all your claims auditable; for example: \"we save you 1,000+ hrs\" feels very sales-y and far reaching","2026-09-06"],["2053123034148405451","in enterprise sales, pilots are the very last stage of sales/buying process — ie bottom-of-funnel\n\nnever, ever middle of the funnel …","2026-05-09"],["2007072423925956723","startups: if you do a POC with an enterprise, highly recommend you charge a fee \n\nesp. true if you're NOT speaking directly with budget holder \n\nthe fee is NOT about $$, it's about their intent, focus, and attention in POC\n\nensure they're aware this is more a service/consulting fee (they are used to buying services!)\n\n$100K ACV: $100,000 ÷ 52 ≈ $1,923 per week\n\n2-week POC = ~$4K\n4-week POC = ~$8K\n\nyou can suggest you will return the fee if they do a full roll-out by subtracting from total cost \n\nnote: the shorter the better, i.e. 2 weeks is better than 4, but understand some might need 4 to unlock value","2026-01-02"],["2002721418924978355","\"require a ton of security requirements\" - this is why framing around a lower-risk use case is critical, where they become far more flexible on when it needs to be complete -- of course they won't let you touch employee/customer data without proper guardrails","2025-12-21"],["1913203874132791431","enterprise startups: turn the executive (buyer) into a user ASAP\n\nyes, that means building out value for them, too\n\nthis largely gets ignored in early days (and beyond)\n\nspeed to value for user and exec needs to be done in tandem now","2025-04-18"],["1900154045374816765","in enterprise sales, getting foot in the door is all that matters right now \n\n>> sub 90-day (pilot) sales cycles\n>> capture value in under 30-days\n>> execs that are also users of product \n\neverything changing too fast, 9-month (land) isn’t feasible anymore … \n\ngetting a small pilot through is far more important as value/project mgmt. should drive $$$ expansion\n\nit also makes it a hell if a lot easier for them to buy ;)","2025-03-13"],["1767560861248364571","remember, most deals die before OR in procurement\n\nproject manage the sh*t out of the deal with \nweekly check-ins","2024-03-12"],["2010881914219995386","enterprise sales:\n\ncall 1: 99% sales, 1% project management\ncall 2 - 35: 1% sales, 99% project management","2026-01-13"],["1934578039301509623","startups — its much harder to get free users to start paying than to acquire paid users from the start\n\nnever do free pilots","2025-06-16"],["1911109638751219855","startups: the enterprise market expects PLG-like experience (easy, no lift, and immediate value) -- and enterprise sales level project management/hand-holding","2025-04-12"],["1908971459365724651","find a low risk, confined way for them to experience your magic and hand-hold them —- this is enteprise sales today","2025-04-06"],["1903045675341713702","the market really wants to see you work for it and make it a no-brainer for them\n\nthey almost all have worked with the startups previously \n\nexamples:\n- no more long (land) sales cycles \n- no more extensive mutual action plans\n- no more passing off to junior reps\n- no more lengthy sales decks \n\nif it’s not clear, obvious, and easy/low risk to assess value — very, very hard to generate momentum","2025-03-21"],["1896889318326550936","enteprise startups - i can’t recommend enough to truncate deal\n\nit can shorten sales cycle dramatically … if done right \n\nmake it so easy for them to test value \n\nallows you to control timing far more than you think AND project manage tightly \n\nselling in this environment of abundance of AI options — ease to partner is critical \n\ngetting in is everything\n\n‘pilot-led growth’ — hint: product needs to be able to support it","2025-03-04"],["1881427298874016113","in early days, an enterprise pilot is service-led value\n\noften extremely manual, requiring significant project management, and hand-held customization\n\nwhite-glove service is a big aspect of  'product' value when you move up-market","2025-01-20"],["1840805013330796868","enterprise early adopters want to test your value in a highly contained way, i.e., a single use case, within a single team, a single point in the value chain, etc.","2024-09-30"],["1815733161193591215","phased implementation and services provide enterprises with a tailored, structured path to formal deployment -- AND, shows high, consistent intent from their side over course of ~15 months","2024-07-23"],["1804169854515319225","earlier you are/limited proof, more pilot steps and lift they expect you to do (that’s how enterprises buy) — earn their business (by doing their work - hard truth)","2024-06-21"],["1790689935416078591","the distance between moving someone from a 'design partner' into a 'formal paying partner' is sometimes as wide as the pacific ocean\n\nsaid differently, for startups the real selling starts once they agree to a design partnership -- there is still a lot of work to do to unlock and capture real $$ beyond the 'LOI' or small fee you charged up-front and lock them in long-term","2024-05-15"]]},{"name":"Proposal","tips":[["2116859043947872763","note: landing at sub $100K is super dangerous. often not on exec radar/their baby — easy to cut, ignore, push to side re: limited value","2026-11-01"],["2111925924379983939","in enterprise sales: if you’re sharing pricing before you really understand how this is getting funded and defended internally, you’re doing it all wrong …","2026-10-18"],["2098048598332019075","if the executive sponsor, does NOT need to see the solution \n\nyou're price/business value is too low OR perceived to be too low","2026-09-10"],["2096569097836261653","services are their largest budget line item; find a way to leverage this; it's also the fastest way in","2026-09-06"],["2078508731235455395","'This price seems fair' = this falls below what I had budgeted","2026-07-18"],["2050583266457989577","enterprise sales is knowing the sales team and buyer are same friggin’ team \n\n“how do we help you navigate this internally; pricing structure, invoicing, the highly-contextualized memo, etc … it’s co-authorship”\n\nVS\n\n“Here are our terms …”","2026-05-02"],["2017614496424948127","it’s much, much better to sell to a single team/unit/owner than it is to capture multi-team\n\n- increase odds dramatically \n- navigate dynamics one group\n- co-author and make project of ONE\n\ncrossing teams decreases the land by ~ 50% … \n\nthere’s too many forces that can kill a deal … \n\nstay contained AND easy to expand if you can deliver obvious value","2026-01-31"],["2008672878666150378","in enterprise sales, the more they have their fingerprints on it, the more they will push for you \n\nliterally invite them in to co-write the pitch to their team … \n\nlearn from them, let them have a voice \n\ncontextualization AND co-authorship is everything","2026-01-06"],["2004900109868204068","truncating deals is fastest way into enteprise, then expand — land $100K-300K — NOT $10K or $1MM","2025-12-27"],["1997698755412254913","price dictates who needs to be involved in discussions (this is actually very important)","2025-12-07"],["1925167022163345847","enterprise startups: creative deal structuring both excites the customer and accelerates sales/buying cycle …\n\nco-author with them and get their exec. finger-prints \n\nnever do it in isolation with hopes\nIt lands - always needs refinement from their side  …","2025-05-21"],["1869530668054564866","If you did not co-write the RFP, you are likely just a checkbox in their buying process.","2024-12-18"],["1849095705031291286","big enterprise relationships start small\n\nan early-stage startup is a risk.\ngolden goose’s want to stomp out risk.\npositioning yourself in a confined, controlled way is how you derisk.\n\nco-authoring that is key \n\nif you deliver on the value, it will naturally expand, meaning you have the proof points to de-risk for next group internally — this compounds\n\nenterprise sales is NOT landing a $1MM/year 1, it will be sidelined OR often not meet their expectations …","2024-10-23"],["1767886597192572961","enterprise startups — if you received a RFP and were not involved in ‘co-writing’/deep conversation prior where you know players and steps you are likely a checkbox in their buying process\n\ndon’t be subservient to a request where you have little intel","2024-03-13"],["1757771510016880700","if you go in with a deal size that's not in their known strike zone (too big or too small), they'll balk","2024-02-14"],["1748691960162906499","Enterprises want predictable pricing schemas and are allergic to most 'usage-based' pricing.","2024-01-20"],["2122067066975043701","most of the work goes into working alongside your internal peer (likely turns to friendship) to craft the 20% to their situation \n\nthis means you need to also understand good deal craft & corporate incentives","2026-11-15"],["2118320776541532653","my absolute favorite part of ENT sales is deal structuring with exec. sponsor\n\n- requires you to think deeply and creatively\n- builds insane trust, if you do it thoughtfully\n- unlocks really understand of org for long-term opps.","2026-11-05"],["2111090544914891153","the effort to close $1MM deal is almost at parity (maybe easier) than a $100k deal","2026-10-16"],["2006351269569397034","enterprise sales is about simplicity   \n\nsimplicity means ...   \n\n- targeted the right person w/influence\n- contained value to a single team/function (land)\n- no-brainer, highly differentiated value\n- ability to test/pilot to reduce risk \n- take on the cost of switching, near zero for them\n- pricing structures they are used i.e. NOT variable costs\n- directly call/text someone they already know throughout entire relationship\n\nnote: this is sell-side's complete responsibility","2025-12-31"],["1997698755412254913","too high and you can overcomplicate it, lengthening sales cycle AND increasing risk of it being killed\n\nland with too low of a price and you can radically stunt growth","2025-12-07"],["1994389807292715423","this type of pricing is a negative signal as it suggests you aren't confident in the product OR the ent. market doesn't see the real value","2025-11-28"],["1983882119785939432","enterprise champions get 1 at-bat every 2-3 years to bring in new technology — you need to really make this a no-brainer for them","2025-10-30"],["1933854618175295840","enteprise startups, now starts the window of time in the year to be allocated into 2026 budget … \n\nJuly 1 - Oct 1","2025-06-14"],["1906795445550252171","startups — the land is far more important that extracting full $$ value right now \n\n1. uncertain times put a hold on net new partners - existing customer can continue to grow \n2. Proven value can always expand\n3. Once your in you get all the ‘insider’ details on where future needs are — competitive intel\n4. Suck oxygen out of room from others — every dollar is competitive","2025-03-31"],["1896892014530269488","note: pricing should be reflective of full deal value OR slight premium on cost per week (mental model) as they test value and get hooked","2025-03-04"],["1865908143617720656","in majority of cases, if you make things cheaper/lower cost for the enterprise, it seldom impacts demand ...","2024-12-08"],["1835651331060633795","splitting/truncating contracts into services and tech is a faster way in and an incentive for them to expedite tech review—certainly increases the odds of coming out the other end.","2024-09-16"],["1828025595017429481","sales length seldom has to do with pricing, unless, of course, you priced yourself in a way where they don't even know what to do with you -- can be too high OR too low","2024-08-26"],["1817545545935720690","if targeting U.S. enterprise market, the 2025 budgeting planning season for most  \n\n>> shared services: July - Oct   \n>> business unit: Sept-Nov","2024-07-28"],["1816142492472844488","Early on, you can be ‘further away’ from product-market fit when selling to enterprises than when selling to users/small businesses. \nHint: High-cost deals are easier to sell than lower-cost ones as you can unlock value outside of the product, i.e., services, 'customization,' and flexibility.","2024-07-24"],["1810005012593992109","services is an incredible wedge into the enterprise (‘service-led GTM’) — you get to build trust, own voice in the education, and counsel to your solution (and capture intel rest of Valley doesn’t have)","2024-07-07"],["1807919523963486652","if you don't offer AND charge for services, someone else will ... \n\nmany are leaving money on the table with a misconception that 'services' are bad\n\nyes, they are bad if it's services to nowhere ... BUT, revenue-generating services to support with acquisition and retention of product(s) is NOT a bad thing","2024-07-01"],["1792885270087450686","Enterprise sales is far more consulting than it is sales  \n\nYou're building a pitch to their specific internal use case\n\nStartups need to be prepared it's ...   \n\n>>> creation of custom slides/decks \n>>> detailed project plans/gantt charts  \n>>> full-time project managing their buying process >>> heavy hand-holding re: onboarding and managing custom requests  \n\nHowever, all of this upfront work should be built into your price.   \n\nThat is why enterprises are willing to pay so much -- they know the effort/time to implement/onboard is sometimes more costly than what you're even selling","2024-05-21"],["1779470399396286588","~10 logos: 'land' deal value usually sits between $75,000 - $250K/year; it's best to assume deals will fall around $100K/year -- you're an unknown entity with no brand equity/track record making it very hard to capture more UNLESS you're building full customization (which is a topic for a different tweet)","2024-04-14"],["1755281456551596261","from my startup sales experience, it's easier to sell a high-cost thing than a low-cost thing","2024-02-07"],["1989315827208724839","$10K - $20K/year deals are NOT enterprise sales","2025-11-14"],["1983882119785939432","pricing is product","2025-10-30"],["1976074668454072787","startups \n\nwhen someone says they closed a $1MM enterprise deal \n\nseldom is that over 12-months \n\noften it’s over 3-5 years\n\nwith an opt-out","2025-10-08"]]},{"name":"Negotiation","tips":[["2121204286923084070","price is the product\n\nyour job in sales it to protect the integrity of that \n\nwalk away if they don’t value it\n\ndon’t make two wrongs and close a bad deal","2026-11-13"],["2114323612429955446","the yucks for an enterprise exec; often leads to ghosting … \n\n- sub $100K price tag\n- skipping steps in sales process \n- $MM price tag and no stage gates \n- saying ‘yes’ to all their requests\n- highly technical pitch \n- sellers role not at parity with buy-side","2026-10-25"],["2017948690002923682","the enterprise market seldom wants discounts   \n\nif they feel price/value is mismatched they want more value from you to close that gap  i.e. 'harder-working' solution ...\n\ndiscounts is often you negotiating with yourself OR procurement not understanding your value and making an ill-fit comparison","2026-02-01"],["2002721418924978355","\"sales cycles are long\" >> only if you're not targeting the right person, company OR structuring deal improperly (i.e. selling across teams, engaged with non-early-adopter, etc.), i've seen ~4-months in many cases","2025-12-21"],["1989315827208724839","> 6 months enterprise sales cycle means something is off - their buying maturity, influence your champion has, etc.","2025-11-14"],["1918641215051902986","enteprise startups\n\nposition yourself where they are unable to make a comparison\n\nProcurement will push their colleagues to use preferred vendors if you're not completely differentiated \n\nkill any comparison idea Day 1","2025-05-03"],["1857576066639855985","\"this is expensive OR outside my budget\"\n\nembrace the pause ... \n\n80% of time, they still buy ... \n\nis exactly the sweet-spot","2024-11-16"],["1816142492472844488","A long sales cycle (12+ months) suggests someone else is educating them OR commoditized, which is also a problem early on. \nHint: Enterprises will pay for services and pilots to learn and ensure best fit — and this is the fastest way for you to get feedback. If you don’t own this, they are paying someone else to educate them and set a strategy — you've likely lost the deal. OR, market is small, over-worked, and/or over-saturated, not enough upside in differentiation to rip and replace.","2024-07-24"],["1813014328792007126","length of the sales cycle seldom has to do with pricing, and mostly has to do with the complexity/buying maturity of the organization\n\nnever sell a 'cheaper' solution in the enterprise - negotiating with yourself","2024-07-16"],["1769821759602045193","anything worthwhile (almost always) requires some form of upfront investment without a guaranteed return\n\nany customer that doesn't agree with this is a huge red flag \n\nthere is risk in any relationship/partnership, and your job is not to be subservient or shoulder it fully yourself\n\nif they ask for free OR heavy discounts, let them go -- trust it will save you set-back/headaches in the future","2024-03-18"],["1762896684781064238","startup founders: your job is to never be a pushover/deferential in sales.\n\nyou do, however, need to understand how to:\n\n- accommodate through understanding\n- get creative (generate win both sides)\n- educate when they don’t understand implications of their asks\n\nthey want to see you draw and hold your line, it builds trust for them, too\n\nit means you know your strengths, weaknesses, and ordering of priorities\n\nthis is essence of a subject matter expert, and what they’re buying access to","2024-02-28"],["2078508731235455395","'circle back' = dead\n\n'get it done asap' = 60-90 days","2026-07-18"],["2078508731235455395","'Give me time' = stop following up mf-er, I'm on it","2026-07-18"],["2000556670728986647","for startups, a high win rate > 50% is a negative signal\n\nin almost all cases, it’s one of the following … \n\n1. Leaving a ton of $$ on table, severing expansion opp.\n2. market is very small, ie niche w/ little competition\n3. not taking big enough bets with widening market convos","2025-12-15"],["1991328637967081522","startups — discounts seldom impact enterprise demand …","2025-11-20"],["1985866106087592164","startups -- in most cases, a really high win rate > 50% is actually NOT a good thing ...\n\n1. price too low\n2. not a healthy mix of outbound \n3. a signal you're in a small market","2025-11-05"],["1927466641144647957","enteprise startups — if you don’t have their cell phone your sales cycle is now longer AND at risk …","2025-05-27"],["1876768045508461003","a very high win rate (>50%) is often not a positive BUT negative signal\n\n- pricing isn't high enough, leaving $$ on table\n- possibly a small, niche target market with capped upside\n- over/mis-selling and lots of churn on other-end","2025-01-07"],["1860021304658624595","sales-cycles can be shortened by 1/3 the time with tight project management.","2024-11-22"],["1840805013330796868","enterprises need to defend adding new partners. as an early-stage startup, the only way to do so is if you can position yourself as a subject matter expert. if you offer similar-ish value, procurement/finance will suggest working with existing partners","2024-09-30"],["1839441503719952875","a longer-ish sales enterprise cycle > 12 months typically suggests you (in most cases) should have sold them some form of service/subject matter expertise as a precursor to 'get the badge'\n\nlong sales cycles are predicated on (1) buyer maturity (not yet ready to purchase tech - need strategy and process defined first) OR (2) highly complex, regulated org. — referring to former in this post\n\nthat badge gives you so much insider intel, expedited procurement approval, and paid to counsel them toward your product","2024-09-26"],["1833243723444130024","enterprise customers want you to hold a hard line   \n\nthey want to hear an early-stage startup say: \n'no, and' OR 'that's outside our expertise, because'\n\nand then explain why ...   \n\nthis is what builds trust, quickly -- knowing you have vision, point of view, and clarity around what you can and can't do today ... \n\nyes-ing them, ironically, attract the wrong folks -- the ones that turn you into a Frankenstein","2024-09-09"],["1828025595017429481","sales cycles in the enterprise can be long for a few reasons\n\nBUT positioning (in your control) impacts far more than you think  ... many mistakingly think it’s ‘pricing’ that impacts length of sale \n\n1. their buying process is complex by nature\n>> often highly regulated markets, compliance checks\n\n2. more immature in purchasing X\n>> new, unfamiliar tech need IT/legal head-nod\n\n3. need to wait for a contract to expire\n>> commodity, mature market - procurement wants to time it\n\n4. lower priority, so easily sidelined\n>> value proposition/ICP needs refining\n\n5. its actually unqualified and dead but no one is willing to share the hard news\n>> qualification stage is weak","2024-08-26"],["1818371861656576188","Negotiated down from 12-month, but able to increase price due to lower commitment -- POC success criteria hit automatic roll-out","2024-07-30"],["1779470399396286588","enterprise buy cycles range from ~6-18 months depending on their buyer maturity -- this stage cannot be rushed but can be tightly managed to expedite -- in some cases, procurement can take anywhere between 2-6 months and is completely predicated on activities the org is going through, such as M&A, available resources to implement/drive transformation, etc.","2024-04-14"],["2113634488815374678","over-preparing wins (scenario planning)\nover-thinking kills (stacking ideas)","2026-10-23"],["2012139791245267234","you can have a much harder sparring  conversation with exec.\n\nsometimes you just need to just say the quiet truth out-loud","2026-01-16"],["1941446361343476156","startups: the market truly care about your speed to reply ... esp. in the enterprise\n\nit's one of the biggest ways to show respect \n\ncheck emails on holidays, weekends, after-hours ...\n\nit does matter","2025-07-05"],["1781274255801335883","Speed to respond to a prospect/customer is critical — be attentive.","2024-04-19"]]},{"name":"Contract Execution","tips":[["2119079107325497493","there are procurement teams out there running circles around sales   \n\nremove emotion, be fair (esp. to your business), critically think, focus on logic, and have your exec partner on standby ...\n\nbrainstorm with internal finance and legal too, sharpest minds with this stuff ...","2026-11-07"],["2096569097836261653","procurement is designed to slow-down momentum in buying process; meaning it's the justification stage; do not let this go more than 30-45 days","2026-09-06"],["2078508731235455395","'send me your paper' = i will send you mine back OR be prepared for 4-6 iterations on your paper","2026-07-18"],["2010330956519919978","when the F1000 asks for your paper, this helps them identify what bucket to slot you re: their paper/procurement team\n\nyour paper is likely not going to be used, BUT a tool for their team to understand how to categorize you\n\nif procurement isn't well-versed in who you are, the easiest thing for them to do is assume \"high risk\" vendor—and send you the kitchen sink\n\nit is your job (with help of a lawyer) to identify what doesn't pertain to you, what needs to be adjusted based off your size, and asking champion what the non-negotiables are beyond obvious business practice\n\nthey absolutely expect you to say NO to some items; it's just easier for them to send you everything.","2026-01-11"],["2004900109868204068","if selling to enterprise, you never send the DocuSign, you send a WORD doc, first — will add 2 weeks to sales cycle","2025-12-27"],["2004900109868204068","net 60 is typically their pay cycle, unless you want to offer 2-3% concession for shorter timeframe","2025-12-27"],["1973875855102521708","startups: execs are on mobile\n\nemails should read like texts\n\nand, texting is the medium to close","2025-10-02"],["1860021304658624595","you will need to hand-hold procurement, a shared resource spread-thin >> do their job for them so doesn't get sidelined -- ask upfront to complete the forms and make it easy for them.","2024-11-22"],["1838353868964417916","a leading indicator of an enterprise deal getting done — main contact gives your their cell number and back and forth moves to text","2024-09-23"],["1780668403176325124","what typically happens is that the contract gets sent to Procurement so they can decipher which paper you'll receive from them\n\neither your champion/buyer OR procurement will reach out to you directly\n\nprocurement is your quarterback with finance, IT, legal ... BUT, it is an entire process on it's own that requires tight project management \n\nthe exec can NOT pay you directly -- please be careful about starting working before procurement signs-off -- finance/accounts payable is the only one who can release funds","2024-04-17"],["1779470399396286588","using their MSA/paper, which will heavily lean in their favor:  you will need a corporate lawyer to review and ensure you’re protected. be prepared to negotiate on common T&C including: payment terms (I’ve seen up to 90 days), insurance policy sizes (i.e., limitations of liability), etc. -- educating them on why certain clauses do not apply for this partnership is critical -- likely get kitchen sink","2024-04-14"],["1982135815468650800","enterprise startups:  getting lost in procurement is 100% a sales process problem …","2025-10-25"],["1945288035337146449","in sales, the only time I send a deck is in procurement/legal","2025-07-16"],["1835651331060633795","IT needs to sign off and is often the bottleneck in the procurement process—there's no skipping IT. Recently quoted ~90-days from procurement lead before IT could review at this specific org. HOWEVER another org. was ~2 weeks, varies a lot org to org.","2024-09-16"]]},{"name":"Closed","tips":[["2010505851363029120","enteprise sales (account) milestones for startups …\n\n- Land w/team: $100K - $250K \n- Expand w/function: $500k-$2MM\n- Establish w/multi c-suite: $3MM +\n\nthe land is so critical — price too low and you’ve set a ceiling on revenue AND attention","2026-01-12"],["2116859043947872763","the entire enterprise game is expansion\n\ngetting in is by far the most arduous part  \n\nthe 10X value/upside is in growing and expanding value with them\n\nso many folks stall out at $100K-$200K /year lands\n\nonce you’re in, you’re in … they want you to be successful","2026-11-01"],["1983882119785939432","$100K deals unlock $1MM deals, expansion is the most critical role in the enteprise","2025-10-30"],["1963941755113349135","Enterprise deals are all about expansion opportunity -- if you’re not expanding by a multiple YoY, someone is not doing their job","2025-09-05"],["1854489098049745212","stages of market pull in the enterprise ...\n\nfirst they co-author \nthen they start intro-ing you \nthen they are reference-selling for you","2024-11-07"],["1830567557784375403","the beauty with enterprise sales is you just need 5-ish (like-minded) customers as references to unlock the next 20.\n\nreferenceability is how you unlock scale in the enterprise:\n>> internally to capture expansion $$\n>> externally to capture net new logos\n\nin essence, those first few logos are worth 1000X what they're paying ...","2024-09-02"],["1823832894554714174","for enterprise startups, the real selling begins once the initial contract is signed ... \n\nenterprise is all about expansion $$$ \n\n$100K unlocks $500K unlocks $1MM\n\nif you can’t crack expansion play, enterprise isn’t worth it — it’s not big enough - yes, I said it - it’s ~4K firms that fit true mold","2024-08-14"],["1779483547998322727","the day you land the deal, is the day you need to be thinking about expansion strategy\n\ni know a LOT of balls to juggle, but expansion is where $100K becomes $300K becomes $750K.","2024-04-14"],["1772938736449339748","the unique advantage of landing and serving the enterprise early on is they will give you a head start on new needs, opportunities, etc, which will be growing rapidly over the next few years ... \n\na $100K deal can convert to $1MM/deal in a few short years -- if relationship is managed tightly","2024-03-27"],["1995837433712452078","in sales, when a customer educates you on a new use case with existing product \n\nso, so, hot 🔥","2025-12-02"],["1878089964828627100","one bad client experience is one less reference, and 3-5 possible intros — this compounds negatively fast \n\na churned client is everyone’s fault …","2025-01-11"]]}];
const X = id => `https://x.com/jjen_abel/status/${id}`;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

function tipNode([id, text, date]) {
  const tip = el("article", { className: "tip" });
  const bar = el("button", { className: "bar", type: "button", title: "Collapse" });
  bar.setAttribute("aria-label", "Collapse quote");
  bar.setAttribute("aria-expanded", "true");
  // avoid doubled marks when the post itself opens with a quotation
  const p = el("p", { textContent: /^["“'‘]|["”'’]$/.test(text) ? text : `“${text}”` });
  const src = el("a", { className: "source", href: X(id), target: "_blank", rel: "noopener", textContent: "Source.", title: `Posted ${date}` });
  tip.append(bar, el("blockquote", { cite: X(id) }, p), src);
  const toggle = force => {
    const collapsed = tip.classList.toggle("collapsed", force);
    bar.setAttribute("aria-expanded", String(!collapsed));
    bar.setAttribute("aria-label", collapsed ? "Expand quote" : "Collapse quote");
    bar.title = collapsed ? "Expand" : "Collapse";
  };
  bar.addEventListener("click", () => toggle());
  p.addEventListener("click", () => { if (tip.classList.contains("collapsed")) toggle(false); });
  tip._toggle = toggle;
  return tip;
}

const list = document.getElementById("stages");
const stageNodes = [];

STAGES.forEach((stage, i) => {
  const id = slug(stage.name);
  const li = el("li", { className: "stage", id });
  const btn = el("button", { className: "stage-toggle", type: "button" },
    el("span", { className: "num", textContent: i + 1 }),
    el("span", { className: "name", textContent: stage.name }),
    el("span", { className: "icon" }));
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", `${id}-panel`);
  const panel = el("div", { className: "panel", id: `${id}-panel`, hidden: true });
  panel.setAttribute("role", "region");
  panel.setAttribute("aria-label", stage.name);
  const tips = el("div", { className: "tips" });
  const collapseAll = el("button", { className: "link-btn", type: "button", textContent: "Collapse all" });
  const tools = el("div", { className: "tools" }, collapseAll);
  const listWrap = el("div");
  tips.append(tools, listWrap);
  panel.append(tips);
  li.append(btn, panel);

  let built = false;
  collapseAll.addEventListener("click", () => {
    const nodes = [...listWrap.children];
    const anyOpen = nodes.some(n => !n.classList.contains("collapsed"));
    nodes.forEach(n => n._toggle(anyOpen));
    collapseAll.textContent = anyOpen ? "Expand all" : "Collapse all";
  });

  const setOpen = (open, scroll) => {
    if (open && !built) { stage.tips.forEach(t => listWrap.append(tipNode(t))); built = true; }
    li.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
    panel.hidden = !open;
    if (open) {
      history.replaceState(null, "", `#${id}`);
      if (scroll) li.scrollIntoView({ block: "start" });
    } else {
      if (location.hash === `#${id}`) history.replaceState(null, "", location.pathname + location.search);
      // keep the header in view when closing a long stage from its sticky position
      if (li.getBoundingClientRect().top < 0) li.scrollIntoView({ block: "start" });
    }
  };
  btn.addEventListener("click", () => setOpen(!li.classList.contains("open")));
  stageNodes.push({ id, setOpen });
  list.append(li);
});

const openFromHash = () => {
  const s = stageNodes.find(s => `#${s.id}` === location.hash);
  if (s) s.setOpen(true, true);
};
openFromHash();
window.addEventListener("hashchange", openFromHash);
</script>
